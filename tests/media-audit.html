<!doctype html><html lang="nl"><meta charset="utf-8"><title>Privé: originele Nijtec-media controleren</title>
<style>body{margin:20px;background:#eee;font:14px Arial;color:#17264e}nav{display:flex;gap:30px;margin-bottom:16px}main{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}figure{margin:0;background:white;padding:8px;min-width:0}img{width:100%;height:170px;object-fit:contain}figcaption{height:40px;overflow-wrap:anywhere}h1{font-size:20px;margin:0}</style>
<nav><h1>Oorspronkelijke media — alleen lokaal</h1><a id="previous">Vorige</a><strong id="page"></strong><a id="next">Volgende</a></nav><main></main>
<script>
const page=Math.max(1,Math.min(5,Number(new URL(location).searchParams.get('page'))||1));
document.querySelector('#previous').href='?page='+Math.max(1,page-1);
document.querySelector('#next').href='?page='+Math.min(5,page+1);
document.querySelector('#page').textContent=page+' / 5';
fetch('/__qa/media-inventory').then(r=>r.json()).then(items=>items.slice((page-1)*24,page*24).forEach((m,i)=>{
 const f=document.createElement('figure'),img=document.createElement('img'),c=document.createElement('figcaption');
 img.src='/__qa/archive'+m.path;img.alt=m.path.split('/').pop();
 c.textContent=((page-1)*24+i+1)+'. '+img.alt;f.append(img,c);document.querySelector('main').append(f);
}));
</script></html>
